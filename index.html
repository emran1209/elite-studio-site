<script>
        function switchTab(tabId) {
            // Hide all tab content sections
            var sections = document.querySelectorAll('.content-section');
            for (var i = 0; i < sections.length; i++) {
                sections[i].classList.remove('active-tab');
            }

            // Remove active status on links
            var links = document.querySelectorAll('.main-nav-links a, .sub-nav-links a');
            for (var j = 0; j < links.length; j++) {
                links[j].classList.remove('active');
            }

            // Show selected section
            var targetSection = document.getElementById('tab-' + tabId);
            if (targetSection) {
                targetSection.classList.add('active-tab');
            }

            // Highlight matching nav link
            var targetNav = document.getElementById('nav-' + tabId);
            if (targetNav) {
                targetNav.classList.add('active');
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleFaq(element) {
            element.classList.toggle('active');
        }

        async function handleAjaxSubmit(e) {
            e.preventDefault();
            var form = document.getElementById('consultation-form');
            var statusMsg = document.getElementById('form-status-msg');
            var submitBtn = document.getElementById('submit-btn');

            submitBtn.value = "Sending Request...";
            submitBtn.disabled = true;

            var formData = new FormData(form);
            var object = Object.fromEntries(formData);
            var json = JSON.stringify(object);

            try {
                var response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: json
                });
                var result = await response.json();
                if (response.status === 200) {
                    statusMsg.style.display = "block";
                    statusMsg.style.color = "#15803d";
                    statusMsg.innerText = "Thank you! Your request has been received. We will contact you within 24 hours.";
                    form.reset();
                } else {
                    statusMsg.style.display = "block";
                    statusMsg.style.color = "#E50914";
                    statusMsg.innerText = result.message || "Submission failed. Please email us directly.";
                }
            } catch (error) {
                statusMsg.style.display = "block";
                statusMsg.style.color = "#E50914";
                statusMsg.innerText = "Something went wrong. Please reach out via phone or email directly.";
            } finally {
                submitBtn.value = "Submit Free Consultation Request";
                submitBtn.disabled = false;
            }
        }
    </script>
