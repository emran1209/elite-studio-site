<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Auto Design Studio | Premium Vehicle Wrap Design</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #ffffff; 
            color: #1c1c1e; 
            padding-top: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px; 
        }
        
        /* HEADER REPLICATION - ENLARGED FONTS */
        header {
            background-color: #ffffff;
            border-bottom: 3px solid #E50914; 
            padding: 22px 40px; 
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-top-wrap {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 32px; 
            font-weight: 900;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #070D1E;
            cursor: pointer;
        }
        .logo span {
            color: #E50914;
        }
        .nav-assembly {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 18px;
        }
        
        /* Top Row Style */
        .nav-row-top {
            display: flex;
            align-items: center;
            gap: 0;
        }
        .sub-nav-links {
            display: flex;
            align-items: center;
        }
        .sub-nav-links a {
            color: #1c1c1e;
            text-decoration: none;
            font-size: 17px; 
            font-weight: 700;
            transition: color 0.2s;
            cursor: pointer;
        }
        .sub-nav-links a:hover {
            color: #E50914;
        }
        .header-phone {
            color: #E50914;
            text-decoration: none;
            font-weight: 800;
            font-size: 26px; 
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
        }
        .divider {
            color: #d2d2d7;
            margin: 0 16px;
            font-size: 16px;
            font-weight: 400;
        }
        
        /* Bottom Row Style */
        .nav-row-bottom {
            display: flex;
            align-items: center;
            gap: 35px;
        }
        .main-nav-links {
            display: flex;
            align-items: center;
        }
        .main-nav-links a {
            color: #1c1c1e;
            text-decoration: none;
            font-size: 20px; 
            font-weight: 800;
            transition: color 0.2s;
            cursor: pointer;
        }
        .main-nav-links a:hover, .main-nav-links a.active {
            color: #E50914;
        }
        
        /* Action Button */
        .header-cta-button {
            display: inline-block;
            background-color: #E50914;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 36px; 
            font-weight: 800;
            border-radius: 30px; 
            font-size: 18px; 
            transition: background-color 0.2s ease;
            text-align: center;
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.15);
            cursor: pointer;
        }
        .header-cta-button:hover {
            background-color: #b20710;
        }

        /* TAB SHOW/HIDE LOGIC CLASSES */
        .content-section {
            display: none; 
        }
        .content-section.active-tab {
            display: block; 
        }

        /* PRICING STYLING */
        .pricing-subheading {
            font-size: 26px;
            font-weight: 800;
            color: #070D1E;
            margin: 40px 0 20px 0;
            text-transform: uppercase;
            border-left: 4px solid #E50914;
            padding-left: 12px;
        }
        .price-tag {
            font-size: 32px;
            font-weight: 900;
            color: #E50914;
            margin-bottom: 15px;
        }
        .price-tag span {
            font-size: 16px;
            color: #48484a;
            font-weight: 400;
        }

        /* SMARTPHONE / MOBILE MEDIA QUERY OPTIMIZATION */
        @media (max-width: 768px) {
            header {
                padding: 15px 15px;
            }
            .header-top-wrap {
                flex-direction: column;
                align-items: center;
                gap: 15px;
                text-align: center;
            }
            .logo {
                font-size: 24px;
            }
            .nav-assembly {
                align-items: center;
                gap: 12px;
                width: 100%;
            }
            .nav-row-top {
                flex-direction: column;
                gap: 8px;
            }
            .sub-nav-links {
                justify-content: center;
                flex-wrap: wrap;
                gap: 5px;
            }
            .sub-nav-links a {
                font-size: 14px;
            }
            .header-phone {
                font-size: 20px;
            }
            .nav-row-bottom {
                flex-direction: column;
                gap: 15px;
                width: 100%;
            }
            .main-nav-links {
                justify-content: center;
                flex-wrap: wrap;
                gap: 10px;
            }
            .main-nav-links a {
                font-size: 15px;
            }
            .divider {
                margin: 0 6px;
                font-size: 13px;
            }
            .header-cta-button {
                width: 100%;
                max-width: 280px;
                padding: 10px 20px;
                font-size: 15px;
            }
            .hero h1 {
                font-size: 32px;
            }
            .hero p.subtitle {
                font-size: 18px;
            }
            .hero {
                padding: 30px 20px;
            }
            h2 {
                font-size: 28px;
            }
            .section-desc {
                font-size: 17px;
            }
            .consult-form {
                padding: 25px 20px;
            }
            .steps-grid {
                grid-template-columns: 1fr !important;
            }
        }

        /* ROLLING MARQUEE TICKER STRIP */
        .trust-ribbon {
            background-color: #000000;
            border-bottom: 3px solid #E50914;
            padding: 14px 0;
            overflow: hidden;
            position: relative;
            display: flex;
        }
        .marquee-track {
            display: flex;
            width: max-content;
            animation: marquee 25s linear infinite;
        }
        .marquee-content {
            display: flex;
            justify-content: space-around;
            gap: 60px;
            padding-right: 60px;
        }
        .ribbon-item {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
            white-space: nowrap;
            text-transform: uppercase;
        }
        .ribbon-item::before {
            content: "•";
            color: #E50914;
            font-size: 20px;
        }
        @keyframes marquee {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }

        /* VALUE CARDS SLIDER */
        .value-slider-box {
            max-width: 1000px;
            margin: 40px auto;
            background-color: #f5f5f7;
            border-radius: 12px;
            border: 1px solid #d2d2d7;
            overflow: hidden;
            position: relative;
        }
        .value-track {
            display: flex;
            width: 300%; 
            animation: rotateValueSequence 15s infinite ease-in-out;
        }
        .value-slide {
            width: 100%;
            padding: 45px 35px;
            text-align: center;
            box-sizing: border-box;
        }
        .value-slide h2 {
            font-size: 32px;
            color: #E50914; 
            margin-bottom: 12px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }
        .value-slide p {
            font-size: 19px;
            line-height: 1.6;
            color: #323234;
            max-width: 750px;
            margin: 0 auto;
        }
        @keyframes rotateValueSequence {
            0%, 28% { transform: translateX(0%); }          
            33%, 61% { transform: translateX(-33.33%); }    
            66%, 95% { transform: translateX(-66.66%); }    
            100% { transform: translateX(0%); }             
        }

        /* HOW IT WORKS 3-STEP PROCESS BAR */
        .how-it-works-box {
            background-color: #070D1E;
            color: #ffffff;
            border-radius: 16px;
            padding: 50px 30px;
            margin: 40px 0 60px 0;
            box-shadow: 0 10px 25px rgba(7, 13, 30, 0.15);
        }
        .how-it-works-box h2 {
            color: #ffffff;
            text-align: center;
            margin-bottom: 10px;
        }
        .how-it-works-box .section-desc {
            color: #94a3b8;
            text-align: center;
            margin-bottom: 40px;
        }
        .steps-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }
        .step-card {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 35px 25px;
            position: relative;
            text-align: left;
        }
        .step-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            background-color: #E50914;
            color: #ffffff;
            border-radius: 50%;
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 20px;
        }
        .step-card h3 {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 10px;
        }
        .step-card p {
            font-size: 15px;
            line-height: 1.6;
            color: #94a3b8;
        }

        /* PREPRESS SPEC CARD */
        .spec-guarantee-box {
            background: #ffffff;
            border: 2px solid #E50914;
            border-radius: 12px;
            padding: 30px;
            margin: 30px 0 50px 0;
        }
        .spec-guarantee-box h3 {
            color: #070D1E;
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .spec-guarantee-box ul {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            list-style: none;
            padding: 0;
        }
        .spec-guarantee-box ul li {
            font-size: 15px;
            color: #323234;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            line-height: 1.5;
        }
        .spec-guarantee-box ul li strong {
            color: #070D1E;
        }

        /* FAQ ACCORDION STYLING */
        .faq-container {
            margin-top: 30px;
        }
        .faq-item {
            background-color: #f5f5f7;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        .faq-question {
            padding: 20px;
            font-size: 18px;
            font-weight: 800;
            color: #070D1E;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        .faq-question:hover {
            color: #E50914;
        }
        .faq-answer {
            display: none;
            padding: 0 20px 20px 20px;
            font-size: 16px;
            line-height: 1.6;
            color: #48484a;
            border-top: 1px solid #e5e5ea;
            padding-top: 15px;
